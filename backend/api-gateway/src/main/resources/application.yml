spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: merchant-service
              uri: ${MERCHANT_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/merchants/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/payments/**

            - id: ledger-service
              uri: ${LEDGER_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/ledger/**

            - id: settlement-service
              uri: ${SETTLEMENT_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/settlements/**

            - id: fraud-service
              uri: ${FRAUD_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/api/fraud/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/api/notifications/**