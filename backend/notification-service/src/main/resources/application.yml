server:
  port: 8087

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/paycore_notification_db
    username: paycore
    password: paycore
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:paycore}
    password: ${SPRING_RABBITMQ_PASSWORD:paycore}

    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 4s
          stateless: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

paycore:
  rabbitmq:
    exchange: notification.exchange
    payment-notification-queue: payment.notification.queue
    payment-notification-routing-key: payment.notification.created

    dead-letter-exchange: notification.dlx
    payment-notification-dlq: payment.notification.dlq
    dead-letter-routing-key: payment.notification.dead

management:
  endpoints:
    web:
      exposure:
        include: health,info